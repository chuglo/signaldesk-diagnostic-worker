[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signaldesk-diagnostic-worker"
version = "0.1.0"
description = "Secure Redis Streams diagnostic worker for SignalDesk"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dnspython>=2.7,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
  "signaldesk-contracts==0.2.0",
]

[project.scripts]
signaldesk-diagnostic-worker = "signaldesk_diagnostic_worker.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.uv.sources]
signaldesk-contracts = { path = "../signaldesk-contracts" }

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk_diagnostic_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
